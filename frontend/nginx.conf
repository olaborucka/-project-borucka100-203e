# nginx.conf — frontend serwisu shop
# Wzorzec z laboratorium: upstream + reverse proxy + CORS + proxy_cache + SPA try_files
# Działa jako non-root na porcie 8080 (pid i pliki tymczasowe w /tmp)

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;

    # Pliki tymczasowe w /tmp — wymagane przy runAsNonRoot w Kubernetes
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    sendfile    on;
    tcp_nopush  on;
    gzip        on;
    gzip_types  text/plain text/css application/json application/javascript;

    # ── Cache API (jak na laboratorium lab05) ─────────────────────────────────
    # /tmp/nginx_cache  — katalog na dysku
    # levels=1:2        — struktura podkatalogów (wydajność)
    # keys_zone=api_cache:5m — nazwa strefy i rozmiar metadanych w RAM (5 MB)
    # inactive=60s      — usuń wpis jeśli nikt nie pytał przez 60s
    # max_size=100m     — maksymalny rozmiar cache na dysku
    proxy_cache_path /tmp/nginx_cache
        levels=1:2
        keys_zone=api_cache:5m
        inactive=60s
        max_size=100m;

    # ── Upstream backend (jak na laboratorium) ────────────────────────────────
    # Docker DNS w K8s rozwiązuje "backend" do ClusterIP serwisu
    upstream backend {
        server backend:3000;
    }

    server {
        listen      8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Proxy /api/* → backend (trailing slash usuwa prefiks /api) ────────
        # Żądanie: /api/products  →  backend otrzymuje: /products
        # Żądanie: /api/products/1 → backend otrzymuje: /products/1
        location /api/ {
            proxy_pass         http://backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # CORS — jak na laboratorium (lab05)
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            # Obsługa preflight OPTIONS
            if ($request_method = OPTIONS) {
                return 204;
            }

            # Cache odpowiedzi GET (jak na lab05)
            proxy_cache            api_cache;
            proxy_cache_methods    GET HEAD;
            proxy_cache_valid      200 30s;
            proxy_cache_use_stale  error timeout;  # stary cache zamiast błędu 502
            proxy_no_cache         $request_method;  # nie cachuj POST/DELETE

            # Nagłówek diagnostyczny — MISS/HIT/EXPIRED (jak na lab05)
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ── Pliki statyczne + SPA fallback (jak na lab05) ─────────────────────
        # 1. $uri      → szuka pliku (np. /style.css → zwróci plik CSS)
        # 2. $uri/     → szuka katalogu z index.html
        # 3. /index.html → fallback: SPA obsługuje routing w JS
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
