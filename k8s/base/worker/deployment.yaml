apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shop
  labels:
    app: worker
    component: background
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        component: background
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # user "app" z Dockerfile workera
        runAsGroup: 1000

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres..."; sleep 2; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false

        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z redis 6379; do echo "waiting for redis..."; sleep 2; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false

      containers:
        - name: worker
          image: ghcr.io/olaborucka/shop/worker:latest
          envFrom:
            - configMapRef:
                name: shop-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shop-secret
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: shop-secret
                  key: DB_PASS

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # Worker nie ma portu HTTP — liveness przez sprawdzenie procesu node
          livenessProbe:
            exec:
              command: ["pgrep", "-x", "node"]
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
