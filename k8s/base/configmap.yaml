apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop
data:
  # konfiguracja niepoufna — zgodnie z wymaganiami projektu
  # hasła i tokeny są w Secret (shop-secret), nie tutaj
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "shop"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  WORKER_INTERVAL: "60"
  PORT: "3000"
