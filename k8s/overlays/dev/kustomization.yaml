apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Środowisko DEV — mniejsze zasoby, 1 replika backendu
# Użycie: kubectl apply -k k8s/overlays/dev

namespace: shop

resources:
  - ../../base

patches:
  # Zmniejsz repliki backendu do 1 (dev nie potrzebuje HA)
  - path: backend-replicas-patch.yaml
  # Zmniejsz limity zasobów
  - path: resources-patch.yaml

# W dev używamy obrazów z tagiem "latest" (bez konkretnego SHA)
images:
  - name: ghcr.io/olaborucka/shop/backend
    newTag: latest
  - name: ghcr.io/olaborucka/shop/frontend
    newTag: latest
  - name: ghcr.io/olaborucka/shop/worker
    newTag: latest
