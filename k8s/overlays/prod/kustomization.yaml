apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Środowisko PROD — 3 repliki backendu, więcej zasobów, konkretny SHA obrazu
# Użycie: kubectl apply -k k8s/overlays/prod
# GitHub Actions nadpisuje tagi przez: kustomize edit set image ...

namespace: shop

resources:
  - ../../base

patches:
  - path: backend-replicas-patch.yaml
  - path: resources-patch.yaml

# GitHub Actions nadpisuje te tagi przez: kustomize edit set image
# np.: kustomize edit set image ghcr.io/olaborucka/shop/backend=ghcr.io/olaborucka/shop/backend:abc1234
images:
  - name: ghcr.io/olaborucka/shop/backend
    newTag: latest
  - name: ghcr.io/olaborucka/shop/frontend
    newTag: latest
  - name: ghcr.io/olaborucka/shop/worker
    newTag: latest
